<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pendaftaran Akun Baru | Rasa Nusantara</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="navbar">
      <div class="container nav-inner">
        <a href="index.html" class="logo">
          <span class="logo-badge">RN</span>
          Rasa Nusantara
        </a>
        <nav>
          <ul class="nav-links">
            <li><a href="index.html">Beranda</a></li>
            <li><a href="index.html#menu">Menu Kuliner</a></li>
            <li><a href="login.html" class="btn-masuk">Masuk</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main class="container auth-wrapper">
      <div class="auth-card">
        <h1>Pendaftaran Akun Baru</h1>
        <p class="auth-sub">Daftar sebagai Pengunjung atau Mitra UMKM Kuliner</p>

        <form action="login.html">
          <div class="form-grup">
            <label for="nama">Nama Lengkap / Nama UMKM</label>
            <input
              type="text"
              id="nama"
              name="nama"
              placeholder="Warung Padang Sederhana"
              required
            />
          </div>
          <div class="form-grup">
            <label for="email">Alamat Email</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="mitra@sederhana.com"
              required
            />
          </div>
          <div class="form-grup">
            <span class="label" id="label-tipe">Tipe Akun</span>
            <div class="pilihan-tipe" role="radiogroup" aria-labelledby="label-tipe">
              <input type="radio" id="tipe-mitra" name="tipe" value="mitra" checked />
              <label for="tipe-mitra">Mitra UMKM</label>
              <input type="radio" id="tipe-umum" name="tipe" value="umum" />
              <label for="tipe-umum">Pembeli Umum</label>
            </div>
          </div>
          <div class="form-grup">
            <label for="password">Kata Sandi</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Buat kata sandi"
              required
            />
          </div>
          <button type="submit" class="btn btn-merah btn-blok">
            DAFTAR SEKARANG
          </button>
        </form>

        <p class="auth-bawah">
          Sudah punya akun? <a href="login.html">Masuk di sini</a>
        </p>
      </div>
    </main>

    <footer class="footer">
      <h4>&copy; Lab Pemrograman Komputer 2025 &middot; Rasa Nusantara</h4>
    </footer>
  </body>
</html>
