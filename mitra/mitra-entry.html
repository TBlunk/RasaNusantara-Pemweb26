<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form Mitra | Rasa Nusantara</title>
    <link rel="stylesheet" href="../css/admin.css" />
  </head>
  <body>
    <aside class="sidebar">
      <div class="logo-details">
        <span class="logo-badge">RN</span>
        <span class="logo_name">Rasa Nusantara</span>
      </div>
      <ul class="nav-links">
        <li><a href="../dashboard.html" class="active">Dashboard</a></li>
        <li><a href="../menu/menu.html#pilih">Menu Kuliner</a></li>
        <li><a href="../kategori/kategori.html">Kategori</a></li>
        <li class="keluar"><a href="../login.html">Keluar (Logout)</a></li>
      </ul>
    </aside>

    <section class="home-section">
      <header class="topbar">
        <h1>Tambah / Ubah Mitra</h1>
        <span class="badge-mitra">Login sebagai: Admin</span>
      </header>

      <main class="home-content">
        <form class="form-card" action="../dashboard.html">
          <div class="form-grup">
            <label for="nama">Nama Usaha / Mitra</label>
            <input type="text" id="nama" name="nama" placeholder="Contoh: Warung Padang Sederhana" required />
          </div>

          <div class="form-grup">
            <label for="pemilik">Nama Pemilik</label>
            <input type="text" id="pemilik" name="pemilik" placeholder="Nama lengkap pemilik usaha" required />
          </div>

          <div class="form-grup">
            <label for="email">Email Akun Login Mitra</label>
            <input type="text" id="email" name="email" placeholder="mitra@contoh.com" required />
          </div>

          <div class="form-grup">
            <label for="daerah">Daerah Asal Masakan</label>
            <input type="text" id="daerah" name="daerah" placeholder="Contoh: Sumatera Barat" required />
          </div>

          <div class="form-grup">
            <label for="alamat">Alamat Usaha</label>
            <textarea id="alamat" name="alamat" rows="3" placeholder="Alamat lengkap usaha"></textarea>
          </div>

          <div class="form-grup">
            <span class="label" id="label-status">Status Mitra</span>
            <div class="pilihan-inline" role="radiogroup" aria-labelledby="label-status">
              <label><input type="radio" name="status" value="aktif" checked /> Aktif</label>
              <label><input type="radio" name="status" value="nonaktif" /> Nonaktif</label>
            </div>
          </div>

          <div class="form-aksi">
            <button type="submit" class="btn btn-merah">Simpan</button>
            <a href="../dashboard.html" class="btn btn-garis">Batal</a>
          </div>
        </form>
      </main>
    </section>
  </body>
</html>
